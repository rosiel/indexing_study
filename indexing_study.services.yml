services:
  logger.channel.indexing_study:
    parent: logger.channel_base
    arguments: ['indexing_study']
  indexing_study.breadcrumbs:
    class: Drupal\indexing_study\IndexingStudyBreadcrumbBuilder
    arguments: [ '@entity_type.manager', '@request_stack', '@config.factory']
    tags:
      - { name: breadcrumb_builder, priority: 100 }
  indexing_study.utils:
    class: Drupal\indexing_study\IndexingStudyUtils
    arguments: ['@database', '@config.factory']
  indexing_study.study_overview:
    class: Drupal\indexing_study\IndexingStudyOverview
    arguments: ['@indexing_study.utils', '@entity_type.manager', '@current_user']
