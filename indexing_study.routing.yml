indexing_study.study:
  path: '/study/{study_node}'
  defaults:
    _controller: '\Drupal\indexing_study\Controller\IndexingStudyController::study'
    _title: 'Study Summary'
  requirements:
    _custom_access: '\Drupal\indexing_study\Controller\IndexingStudyController::access'
  options:
    parameters:
      study_node:
        type: entity:node
indexing_study.assign:
  path: '/study/{study_node}/assign'
  defaults:
    _form: '\Drupal\indexing_study\Form\IndexingStudyAssignmentForm'
    _title: 'Create assignments for this Study'
  requirements:
    _custom_access: '\Drupal\indexing_study\Controller\IndexingStudyController::access'
  options:
    parameters:
      study_node:
        type: entity:node
indexing_study.analyze:
  path: '/study/{study_node}/analyze'
  defaults:
    _controller: '\Drupal\indexing_study\Controller\IndexingStudyController::analyze'
    _title: 'Analyze subjects'
  requirements:
    _custom_access: '\Drupal\indexing_study\Controller\IndexingStudyController::access'
  options:
    parameters:
      study_node:
        type: entity:node
    no-cache: 'TRUE'
indexing_study.consensus:
  path: '/study/{study_node}/consensus'
  defaults:
    _controller: '\Drupal\indexing_study\Controller\IndexingStudyController::consensus'
    _title: 'Create Consensus'
  requirements:
    _custom_access: '\Drupal\indexing_study\Controller\IndexingStudyController::access'
  options:
    parameters:
      study_node:
        type: entity:node
    no-cache: 'TRUE'
indexing_study.agreement:
  path: '/study/{study_node}/agreement'
  defaults:
    _controller: '\Drupal\indexing_study\Controller\IndexingStudyController::agreement'
    _title: 'Create Agreement'
  requirements:
    _custom_access: '\Drupal\indexing_study\Controller\IndexingStudyController::access'
  options:
    parameters:
      study_node:
        type: entity:node
    no-cache: 'TRUE'
